name: Deploy website
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Lint code
        run: npm run lint
      - name: Test code
        run: npm run test
  build:
    outputs:
      file-name: "${{ steps.file_name1.outputs.file_name }}"
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
      - name: output filename
        id: file_name1
        run: |
         find dist/assets/*.js -type f -execdir echo 'file_name={}' >> $GITHUB_OUTPUT ';'
         echo "GITHUB_OUTPUT"
      - name: upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: my-artifact
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: download artifact
        uses: actions/download-artifact@v7
        with:
            name: my-artifact
      - name: print filename
        run: echo "${{ needs.build.outputs.file_name }}"
      - name: list artifacts
        run: ls
      - name: Deploy
        run: echo "Deploying..."
